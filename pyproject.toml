[project]
name = "sparv-sbx-corpus-statistics"
version = "0.1.0"
description = "Sparv plugin to collect statistics about the created corpus"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  # "Development Status :: 4 - Beta",
  # "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  # "uncomment if you test on these interpreters:",
  # "Programming Language :: Python :: Implementation :: IronPython",
  # "Programming Language :: Python :: Implementation :: Jython",
  # "Programming Language :: Python :: Implementation :: Stackless",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "attrs>=25.3.0",
  "numpy>1.24.4",
  "running-stats>=0.2.0",
  "sparv>=5.3.1",
  "strenum>=0.4.15",
]

[project.urls]
"Bug Tracker" = "https://github.com/spraakbanken/sparv-sbx-corpus-statistics/issues"
Homepage = "https://spraakbanken.gu.se"
Repository = "https://github.com/spraakbanken/sparv-sbx-corpus-statistics"

[project.entry-points."sparv.plugin"]
sbx_corpus_statistics = "sbx_corpus_statistics"

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
  "ruff>=0.11.7",
  "syrupy>=4.9.1",
]
metadata = [
  "sparv-sbx-metadata",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "sbx_corpus_statistics"
source-exclude = ["/.github", "/docs"]

[tool.uv.sources]
sparv-sbx-metadata = { git = "https://github.com/spraakbanken/sparv-sbx-metadata", tag = "v2.3.1" }
